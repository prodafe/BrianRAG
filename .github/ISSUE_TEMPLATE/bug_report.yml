name: Bug Report
description: 报告一个 bug
labels: [bug]
body:
  - type: textarea
    attributes:
      label: 描述
      description: 清晰描述遇到的问题
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      description: 如何触发这个 bug
      placeholder: |
        1. 打开...
        2. 点击...
        3. 看到错误...
  - type: textarea
    attributes:
      label: 期望行为
      description: 你期望发生什么
  - type: input
    attributes:
      label: Python 版本
      placeholder: "3.11"
  - type: textarea
    attributes:
      label: 日志/错误信息
      description: 粘贴相关日志或错误 traceback
