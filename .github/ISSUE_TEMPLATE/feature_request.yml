name: Feature Request
description: 建议一个新功能
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: 需求描述
      description: 清晰描述你想要的功能
    validations:
      required: true
  - type: textarea
    attributes:
      label: 使用场景
      description: 这个功能在什么场景下会用到
  - type: textarea
    attributes:
      label: 可能的实现方案
      description: 如果你有想法，可以描述一下实现思路
