name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.6"
      - run: |
          echo "=== ruff version ===" && ruff --version
          echo "=== git commit ===" && git log -1 --oneline
          echo "=== working dir ===" && pwd && ls -la
          echo "=== pyproject.toml ===" && head -120 pyproject.toml
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pytest-cov pydantic pydantic-settings rank_bm25 jieba redis
      - run: pytest tests/ -v -m "not integration and not slow"
