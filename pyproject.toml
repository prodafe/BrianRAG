[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brianrag"
version = "2.0.0"
description = "Enterprise Knowledge Engine — 本地优先 RAG 知识库问答系统"
readme = "readme.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "Brian"}]
keywords = ["rag", "llm", "knowledge-base", "retrieval", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "langchain-postgres>=0.0.13",
    "redis[hiredis]>=5.1",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    "ollama>=0.4.0",
    "httpx>=0.27.0",
    "pypdf>=5.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "unstructured>=0.15.0",
    "jieba>=0.42.1",
    "tiktoken>=0.7.0",
    "numpy>=1.26.0",
    "networkx>=3.3",
    "splink>=4.0",
    "ragas>=0.2.0",
    "scikit-learn>=1.5.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "apscheduler>=3.10",
    "watchdog>=5.0",
    "slowapi>=0.1.9",
    "transformers>=4.45.0",
    "torch>=2.4.0",
    "pandas>=2.2",
    "pillow>=10.4",
    "chardet>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/prodafe/BrianRAG"
Documentation = "https://github.com/prodafe/BrianRAG#readme"
Repository = "https://github.com/prodafe/BrianRAG.git"
Issues = "https://github.com/prodafe/BrianRAG/issues"
Changelog = "https://github.com/prodafe/BrianRAG/blob/main/CHANGELOG.md"

[project.scripts]
brianrag = "run:main"

[tool.setuptools.packages.find]
include = ["core*", "api*", "utils*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: slow tests (needs LLM or DB)",
    "integration: integration tests (needs live services)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["core", "api", "utils"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B007", "B008", "B904", "E402", "E701", "E702", "E722", "E741", "F402", "F841", "N806", "SIM115", "SIM116"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
